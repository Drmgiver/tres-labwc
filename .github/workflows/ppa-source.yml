name: Tres PPA source packages

on:
  push:
    branches: [main]
    paths:
      - "debian/**"
      - "packaging/**"
      - "src/**"
      - "scripts/**"
      - ".github/workflows/ppa-source.yml"
  pull_request:
    paths:
      - "debian/**"
      - "packaging/**"
      - "src/**"
      - "scripts/**"
      - ".github/workflows/ppa-source.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    name: Validate paired Noble and Resolute sources
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout committed source
        uses: actions/checkout@v4
      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential debhelper dh-python dpkg-dev devscripts lintian python3
      - name: Bootstrap unsigned Noble source for CI review
        run: bash scripts/build-ppa-source.sh noble --unsigned
      - name: Build Resolute source reusing exact Noble orig archive
        run: bash scripts/build-ppa-source.sh resolute --unsigned
      - name: Verify paired Ubuntu source uploads
        run: |
          for series in noble resolute; do
            case "$series" in
              noble) version='1.0.0-1~ppa1~ubuntu24.04.1' ;;
              resolute) version='1.0.0-1~ppa1~ubuntu26.04.1' ;;
            esac
            changes="dist/ppa/$series/tres_${version}_source.changes"
            test -s "$changes"
            grep -Fx "Distribution: $series" "$changes"
            grep -Fx "Version: $version" "$changes"
            grep -Fx "Architecture: source" "$changes"
            test -s "dist/ppa/$series/tres_1.0.0.orig.tar.gz"
            test -s "dist/ppa/$series/tres_${version}.dsc"
            test -s "dist/ppa/$series/tres_${version}_source.buildinfo"
          done
          cmp dist/ppa/noble/tres_1.0.0.orig.tar.gz dist/ppa/resolute/tres_1.0.0.orig.tar.gz
          ! grep -F 'tres_1.0.0.orig.tar.gz' dist/ppa/resolute/tres_1.0.0-1~ppa1~ubuntu26.04.1_source.changes
      - name: Lint source packages (report only)
        run: |
          for series in noble resolute; do
            lintian dist/ppa/"$series"/*.dsc 2>&1 | tee "dist/ppa/$series/lintian-source.txt" || true
          done
      - name: Upload unsigned Noble review artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tres-ppa-noble-unsigned
          path: dist/ppa/noble/
          if-no-files-found: error
      - name: Upload unsigned Resolute review artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tres-ppa-resolute-unsigned
          path: dist/ppa/resolute/
          if-no-files-found: error
